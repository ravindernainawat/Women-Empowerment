services:
  - type: web
    name: weis-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./weis.db
      - key: CORS_ORIGINS
        value: "*"
